{% set name = "symbolfit" %}
{% set version = "0.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/symbolfit-{{ version }}.tar.gz
  sha256: 7568eb237b591dd1822e46bec8416262a9111fadf2e3ec25bffae6bf8c113e27

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - pysr >=1.5.0,<=1.5.2
    - lmfit >=1.3.0,<1.4.0
    - matplotlib-base >=3.10.0,<4.0.0
    - seaborn >=0.13.0,<0.14.0
    - numpy >=2.0.0,<2.3.0

test:
  imports:
    - symbolfit
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/hftsoi/symbolfit
  summary: Automatic parametric modeling with symbolic regression
  license: MIT
  license_file: LICENSE
  description: |
    An API to automate parametric modeling with symbolic regression, originally developed for data analysis in the experimental high-energy physics community, but also applicable beyond.
  doc_url: https://symbolfit.readthedocs.io

extra:
  recipe-maintainers:
    - hftsoi
